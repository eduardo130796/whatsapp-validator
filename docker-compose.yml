version: "3.8"

services:
  postgres:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validator"]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: validator_postgres
    restart: always
    environment:
      POSTGRES_USER: validator
      POSTGRES_PASSWORD: validator
      POSTGRES_DB: validator
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: validator_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: ./api
    container_name: validator_api
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

  worker:
    build: ./worker
    container_name: validator_worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    volumes:
      - session_data:/app/session

volumes:
  pg_data:
  session_data: